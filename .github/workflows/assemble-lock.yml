name: Assemble package lock

on:
  push:
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: cat .sync/package-lock.b64.part* | base64 -d | gzip -d > package-lock.json
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Restore original package-lock.json from ZIP"
          git push
